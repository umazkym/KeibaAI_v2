            const allVenues = [...new Set(rows.map(r => r['場所']).filter(v => v))];
            const allDists = [...new Set(rows.map(r => r['距離']).filter(v => v))];
            const allCourses = [...new Set(rows.map(r => r['ｺｰｽ']).filter(v => v))];
            
            // 現在のレース条件以外を除外リストに追加
            const excludeVenues = allVenues.filter(v => v !== i.place);
            const excludeDists = allDists.filter(d => d !== i.dist);
            const excludeCourses = allCourses.filter(c => c !== i.course);
            
            setState({
                matchRaceCondition: true,
                venueFilters: excludeVenues,
                distFilters: excludeDists,
                courseFilters: excludeCourses
            });
        }
    };

    function renderMain() {
        if(state.tab === 'summary') return renderSummary();
        if(state.tab === 'chart') return renderChart();
        if(state.tab === 'data') return renderData();
        if(state.tab === 'matchup') return renderMatchup();
    }

    // --- SUMMARY ---
    function renderSummary() {
        const rows = DATA.races[state.race]?.rows || [];
        const raceInfo = DATA.race_info[state.race] || {};
        const oddsData = DATA.odds?.[state.race] || {};
        
        // 馬番ごとにデータを集約
        const horses = {};
        rows.forEach(r => {
            const u = r['番'] || '0';
            if(!horses[u]) {
                horses[u] = {
                    umaban: u,
                    name: r['馬名'] || '',
                    jockey: r['騎手'] || '',
                    records: [],
                    prevJockey: null
                };
            }
            horses[u].records.push(r);
        });
        
        // 各馬の分析
        const summaries = Object.keys(horses).sort((a,b) => parseInt(a) - parseInt(b)).map(u => {
            const h = horses[u];
            const recs = h.records;
            const numRuns = recs.length;
            
            // 騎手情報
            const isTopJockey = TOP_JOCKEYS.some(j => h.jockey.includes(j));
            const prevJockey = recs.length > 1 ? recs[1]['騎手'] : null;
            const jockeyChanged = prevJockey && prevJockey !== h.jockey;
            const jockeyUpgrade = jockeyChanged && TOP_JOCKEYS.some(j => h.jockey.includes(j)) && !TOP_JOCKEYS.some(j => prevJockey.includes(j));
            
            // 複勝率計算
            const validRanks = recs.map(r => parseInt(r['着順'])).filter(x => !isNaN(x));
            const fukushoRate = validRanks.length > 0 ? (validRanks.filter(r => r <= 3).length / validRanks.length * 100) : 0;
            
            // 同条件実績
            const sameVenue = recs.filter(r => r['場所'] === raceInfo.place);
            const sameDist = recs.filter(r => r['距離'] === raceInfo.dist);
            const sameCourse = recs.filter(r => r['ｺｰｽ'] === raceInfo.course);
            const sameCondition = recs.filter(r => r['場所'] === raceInfo.place && r['距離'] === raceInfo.dist && r['ｺｰｽ'] === raceInfo.course);
            
            // T指数・L指数平均（直近3走のみ使用で精度向上）
            const recent3 = recs.slice(0, 3);
            const tVals = recent3.map(r => parseFloat(r['T指数'])).filter(x => !isNaN(x) && x > 0);
            const lVals = recent3.map(r => parseFloat(r['L指数'])).filter(x => !isNaN(x) && x > 0);
            const tAvg = tVals.length ? (tVals.reduce((a,b) => a+b, 0) / tVals.length) : 0;
            const lAvg = lVals.length ? (lVals.reduce((a,b) => a+b, 0) / lVals.length) : 0;
            
            // 同会場でのT指数
            const tSameVenue = sameVenue.map(r => parseFloat(r['T指数'])).filter(x => !isNaN(x) && x > 0);
            const tVenueAvg = tSameVenue.length ? (tSameVenue.reduce((a,b) => a+b, 0) / tSameVenue.length) : 0;
            
            // 近走傾向（直近と過去のT指数比較）
            let trend = 'stable';
            if(tVals.length >= 2) {
                const diff = tVals[0] - tVals[tVals.length - 1];
                if(diff > 3) trend = 'up';
                else if(diff < -3) trend = 'down';
            }
            
            // 直近3走の複勝率
            const recent3Ranks = recent3.map(r => parseInt(r['着順'])).filter(x => !isNaN(x));
            const recent3Fukusho = recent3Ranks.length > 0 ? (recent3Ranks.filter(r => r <= 3).length / recent3Ranks.length * 100) : fukushoRate;
            
            // 【直近3走 + 会場別最適パラメータ】80レース検証結果
            // 中山: L=0.8 T=0.8 F=0.3 → 42.5%
            // 京都: L=0.5 T=0.8 F=0.3 → 50.0%
            // 全体: 46.2% (現行43.8%から+2.4%改善)
            const venue = raceInfo.place || '';
            const isNakayama = venue.includes('中山');
            const runsWeight = numRuns >= 2 ? 1.0 : 0.5;
            
            let score;
            if(isNakayama) {
                // 中山: L指数・T指数同等
                score = lAvg * 0.8 + tAvg * 0.8 + recent3Fukusho * runsWeight * 0.3;
            } else {
                // 京都/その他: L指数控えめ、T指数重視
                score = lAvg * 0.5 + tAvg * 0.8 + recent3Fukusho * runsWeight * 0.3;
            }
            
            // 走数ペナルティ（走数が多いほど的中率低下するため）
            if(numRuns > 5) {
                score -= (numRuns - 5) * 1;
            }
            
            // 信頼度は後でスコア差と走数から計算（ソート後に再計算）
            let reliability = 3; // 仮値
            
            // リスクフラグ
            const risks = [];
            if(numRuns === 1) risks.push('1戦のみ');
            if(sameVenue.length === 0 && raceInfo.place) risks.push(raceInfo.place + '実績なし');
            if(trend === 'down') risks.push('↓下降傾向');
            
            // 穴フラグ
            const chances = [];
            if(jockeyUpgrade) chances.push('🔄有力騎手に乗り替わり');
            if(trend === 'up') chances.push('📈上昇傾向');
            if(tVenueAvg > tAvg + 5) chances.push('📍' + raceInfo.place + 'で好指数');
            
            // オッズ情報
            const odds = oddsData[parseInt(u)];
            const oddsStr = odds?.odds ? odds.odds + '倍' : '';
            const ninkiStr = odds?.ninki ? odds.ninki + '人気' : '';
            
            return {
                u, name: h.name, jockey: h.jockey, numRuns,
                fukushoRate, tAvg, lAvg, tVenueAvg, score, trend,
                reliability, risks, chances,
                isTopJockey, jockeyChanged, jockeyUpgrade, prevJockey,
                oddsStr, ninkiStr, sameVenue: sameVenue.length
            };
        });
        
        // スコア順にソート
        const sorted = [...summaries].sort((a,b) => b.score - a.score);
        
        // 1位馬の信頼度を走数とスコア差から再計算
        // 検証結果: 走数<=4 AND 差>=7 → 58.3%, 走数<=5 AND 差>=5 → 50%
        if(sorted.length >= 2) {
            const gap = sorted[0].score - sorted[1].score;
            const runs = sorted[0].numRuns;
            
            // 新信頼度計算：走数が少なく差が大きいほど高信頼度
            let newReliability = 2; // ベース
            if(runs <= 4 && gap >= 7) newReliability = 5;        // 最高信頼度 58.3%
            else if(runs <= 5 && gap >= 5) newReliability = 4;   // 高信頼度 50%+
            else if(runs <= 5 || gap >= 5) newReliability = 3;   // 中信頼度
            else if(runs > 6 && gap < 5) newReliability = 1;     // 低信頼度
            
            sorted[0].reliability = newReliability;
            sorted[0].gapTo2nd = gap.toFixed(1);
            
            // 2位以降は差分ベースで信頼度を設定
            for(let i = 1; i < sorted.length; i++) {
                const gapFromFirst = sorted[0].score - sorted[i].score;
                if(gapFromFirst <= 5) sorted[i].reliability = 3;
                else if(gapFromFirst <= 10) sorted[i].reliability = 2;
                else sorted[i].reliability = 1;
            }
        }
        
        // T指数下位25%を「複勝圏外候補」として特定
        const tAvgValues = summaries.filter(s => s.tAvg > 0).map(s => s.tAvg).sort((a,b) => a - b);
        const tAvgThreshold = tAvgValues.length >= 4 ? tAvgValues[Math.floor(tAvgValues.length / 4)] : 0;
        sorted.forEach(s => { s.isElimination = s.tAvg > 0 && s.tAvg <= tAvgThreshold; });
        
        // HTML生成
        const cards = sorted.map(s => {
            const stars = '★'.repeat(s.reliability) + '☆'.repeat(5 - s.reliability);
            const reliabilityColor = s.reliability >= 4 ? '#059669' : (s.reliability >= 2 ? '#d97706' : '#dc2626');
            const jockeyStyle = s.isTopJockey ? 'color:#2563eb;font-weight:bold' : '';
            const jockeyIcon = s.jockeyUpgrade ? '<span title="有力騎手に乗り替わり" style="margin-left:4px">🔄</span>' : '';
            
            // 複勝圏外候補の場合はグレーアウト
            const eliminationStyle = s.isElimination ? 'opacity:0.5;border:2px solid #dc2626;' : '';
            const eliminationBadge = s.isElimination ? '<span style="background:#dc2626;color:white;font-size:9px;padding:2px 6px;border-radius:4px;margin-left:4px">圏外候補</span>' : '';
            
            const risksHtml = s.risks.length ? `<div style="color:#dc2626;font-size:10px;margin-top:4px">⚠️ ${s.risks.join(', ')}</div>` : '';
            const chancesHtml = s.chances.length ? `<div style="color:#059669;font-size:10px;margin-top:4px">${s.chances.join(' ')}</div>` : '';
            
            const venueNote = s.sameVenue > 0 ? `<span style="color:#059669;font-size:9px;margin-left:4px">${raceInfo.place}${s.sameVenue}走</span>` : `<span style="color:#dc2626;font-size:9px;margin-left:4px">${raceInfo.place}実績なし</span>`;
            const tVenueNote = s.tVenueAvg > 0 ? `(${raceInfo.place}${s.tVenueAvg.toFixed(1)})` : '';
            
            return `
            <div class="card" style="padding:12px;margin-bottom:8px;${eliminationStyle}">
                <div class="flex-ac gap-2" style="margin-bottom:8px">
                    <div class="h-num" style="background:${WAKU[getWaku(s.u)]};color:${TXT[getWaku(s.u)]};width:28px;height:28px;font-size:14px">${s.u}</div>
                    <div style="flex:1">
                        <div class="font-bold" style="font-size:14px">${s.name}${eliminationBadge}</div>
                        <div class="text-xs text-light"><span style="${jockeyStyle}">${s.jockey}</span>${jockeyIcon} (${s.numRuns}走)${venueNote}</div>
                    </div>
                    <div style="text-align:right">
                        <div class="text-xs text-light">${s.oddsStr} ${s.ninkiStr}</div>
                    </div>
                </div>
                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
                    <div>
                        <div class="text-xs text-light">スコア</div>
                        <div style="color:${reliabilityColor};font-weight:bold;font-size:16px">${s.score.toFixed(1)}</div>
                    </div>
                    <div>
                        <div class="text-xs text-light">複勝率</div>
                        <div class="font-bold">${s.fukushoRate.toFixed(0)}%</div>
                    </div>
                    <div>
                        <div class="text-xs text-light">T指数</div>
                        <div class="font-bold">${s.tAvg.toFixed(1)} <span class="text-xs text-light">${tVenueNote}</span></div>
                    </div>
                    <div>
                        <div class="text-xs text-light">L指数</div>
                        <div class="font-bold">${s.lAvg.toFixed(1)}</div>
                    </div>
                </div>
                ${risksHtml}
                ${chancesHtml}
            </div>
            `;
        }).join('');
        
        return `
            <div style="margin-bottom:8px">
                <div class="text-xs text-light" style="margin-bottom:4px">※信頼度順に表示（走数・複勝率・同条件実績・騎手で評価）</div>
            </div>
            ${cards}
        `;
    }

    // --- CHART ---
    function renderChart() {
        const d = DATA.chart_data[state.race] || {horses:[]};
        const blocked = state.filters[state.race] || [];
        
        // getMark: 指定馬番の印を取得
        const getMark = (u) => (state.marks[state.race] || {})[u] || '';
        
        const horseFilters = d.horses.map(h => {
            const mark = getMark(h.umaban);
            const isBlocked = blocked.includes(h.umaban);
            // 印がある場合のみ表示、タップで順次切替
            const markHtml = `<span onclick="event.stopPropagation();cycleMark(${h.umaban})" 
                style="color:#e53935;font-weight:bold;font-size:12px;min-width:14px;text-align:center;cursor:pointer">${mark || '·'}</span>`;
            return `<div onclick="togFilter(${h.umaban})" class="filter-chip" style="opacity:${isBlocked?0.4:1};gap:2px">
                <span class="dot" style="background:${WAKU[h.waku]}"></span>${h.umaban}${markHtml}
            </div>`;
        }).join('');

        // Collect unique venues and distances from data
        const allRecords = [];
        d.horses.forEach(h => h.records.forEach(r => {
            allRecords.push({...r, u:h.umaban, w:h.waku});
        }));
        
        const venues = [...new Set(DATA.races[state.race]?.rows.map(r => r['場所']).filter(v => v))].sort();
        const distances = [...new Set(DATA.races[state.race]?.rows.map(r => r['距離']).filter(v => v))].sort((a,b)=>parseInt(a)-parseInt(b));
        const courses = [...new Set(DATA.races[state.race]?.rows.map(r => r['ｺｰｽ']).filter(v => v))].sort();
        
        // Count occurrences for each venue/distance/course
        const rows = DATA.races[state.race]?.rows || [];
        const venueCounts = {};
        const distCounts = {};
        const courseCounts = {};
        rows.forEach(r => {
            const v = r['場所'];
            const d = r['距離'];
            const c = r['ｺｰｽ'];
            if(v) venueCounts[v] = (venueCounts[v] || 0) + 1;
            if(d) distCounts[d] = (distCounts[d] || 0) + 1;
            if(c) courseCounts[c] = (courseCounts[c] || 0) + 1;
        });
        
        // Course filter with visual indicator (colored dot)
        const courseFilters = courses.map(c => {
            const isHidden = state.courseFilters.includes(c);
            const cnt = courseCounts[c] || 0;
            const dotColor = c === '芝' ? '#00C853' : (c === 'ダート' || c === 'ダ') ? '#FF6D00' : '#888';
            return `<div onclick="togCourse('${c}')" class="filter-chip" style="opacity:${isHidden?0.4:1}"><span class="dot" style="background:${dotColor}"></span>${c}<span style="font-size:8px;color:#888;margin-left:2px">${cnt}</span></div>`;
        }).join('');
        
        const venueFilters = venues.map(v => {
            const isHidden = state.venueFilters.includes(v);
            const cnt = venueCounts[v] || 0;
            return `<div onclick="togVenue('${v}')" class="filter-chip" style="opacity:${isHidden?0.4:1}">${v}<span style="font-size:8px;color:#888;margin-left:2px">${cnt}</span></div>`;
        }).join('');
        
        const distFilters = distances.map(dist => {
            const isHidden = state.distFilters.includes(dist);
            const cnt = distCounts[dist] || 0;
            return `<div onclick="togDist('${dist}')" class="filter-chip" style="opacity:${isHidden?0.4:1}">${dist}<span style="font-size:8px;color:#888;margin-left:2px">${cnt}</span></div>`;
        }).join('');

        return `
            <div class="filter-sticky">
                <div class="filter-row">
                    <span class="filter-label">日付:</span>
                    <input type="text" value="${state.filterDateFrom}" placeholder="開始日" 
                           style="border:1px solid #ccc; padding:2px 4px; border-radius:4px; font-size:10px; width:75px"
                           onchange="setState({filterDateFrom: this.value})">
                    <span style="font-size:10px;margin:0 2px">～</span>
                    <input type="text" value="${state.filterDateTo}" placeholder="終了日" 
                           style="border:1px solid #ccc; padding:2px 4px; border-radius:4px; font-size:10px; width:75px"
                           onchange="setState({filterDateTo: this.value})">
                </div>
                <div class="filter-row">
                    <span class="filter-label">コース:</span>${courseFilters}
                </div>
                <div class="filter-row">
                    <span class="filter-label">場所:</span>${venueFilters}
                </div>
                <div class="filter-row">
                    <span class="filter-label">距離:</span>${distFilters}
                </div>
                <div class="filter-row">
                    <span class="filter-label">馬番:</span>${horseFilters}
                </div>
            </div>
            <div class="card">
                <div class="font-bold text-xs">① スピード(縦) vs スタミナ(横)</div>
                <div id="c1" style="height:260px;margin-bottom:10px"></div>
                
                <div class="font-bold text-xs">② タイム(縦) vs 位置取り(横)</div>
                <div id="c2" style="height:260px;margin-bottom:10px"></div>
                
                <div class="font-bold text-xs">③ 末脚(縦) vs 位置取り(横)</div>
                <div id="c3" style="height:260px;margin-bottom:10px"></div>

                <div class="font-bold text-xs">④ 上がり指数(縦) vs RPCI(横)</div>
                <div id="c4" style="height:260px"></div>
            </div>`;
    }
    
    window.togFilter = (u) => {
        const old = state.filters[state.race] || [];
        const next = old.includes(u) ? old.filter(x=>x!==u) : [...old, u];
        setState({filters: {...state.filters, [state.race]: next} });
    };
    
    window.setMark = (u, mark) => {
        const raceMarks = state.marks[state.race] || {};
        if(mark) {
            raceMarks[u] = mark;
        } else {
            delete raceMarks[u];
        }
        const newMarks = {...state.marks, [state.race]: raceMarks};
        state.marks = newMarks;
        // localStorageに保存
        try {
            localStorage.setItem('keibaMarks', JSON.stringify(newMarks));
        } catch(e) {}
        render();
    };
    
    window.cycleMark = (u) => {
        const currentMark = (state.marks[state.race] || {})[u] || '';
        const idx = MARKS.indexOf(currentMark);
        const nextMark = MARKS[(idx + 1) % MARKS.length];
        setMark(u, nextMark);
    };
    
    window.togVenue = (v) => {
        const next = state.venueFilters.includes(v) ? state.venueFilters.filter(x=>x!==v) : [...state.venueFilters, v];
        setState({venueFilters: next});
    };
    
    window.togDist = (d) => {
        const next = state.distFilters.includes(d) ? state.distFilters.filter(x=>x!==d) : [...state.distFilters, d];
        setState({distFilters: next});
    };
    
    window.togCourse = (c) => {
        const next = state.courseFilters.includes(c) ? state.courseFilters.filter(x=>x!==c) : [...state.courseFilters, c];
        setState({courseFilters: next});
    };

    function drawCharts() {
        const d = DATA.chart_data[state.race];
        const blocked = state.filters[state.race] || [];
        const active = d.horses.filter(h => !blocked.includes(h.umaban));
        if(!active.length) return;
        
        const rows = DATA.races[state.race]?.rows || [];
        const rowMap = {}; // date+umaban -> row
        rows.forEach(r => {
            const key = r['日付'] + '-' + r['番'];
            rowMap[key] = r;
        });

        const pts = [];
        active.forEach(h => h.records.forEach(r => {
            // Date Filter (範囲指定)
            if(state.filterDateFrom && r.date < state.filterDateFrom) return;
            if(state.filterDateTo && r.date > state.filterDateTo) return;
            
            // Lookup row for venue/dist
            const rowKey = r.date + '-' + h.umaban;
            const row = rowMap[rowKey];
            
            // Venue Filter (exclude if in list)
            if(state.venueFilters.length > 0 && row && state.venueFilters.includes(row['場所'])) return;
            
            // Distance Filter (exclude if in list)
            if(state.distFilters.length > 0 && row && state.distFilters.includes(row['距離'])) return;
            
            // Course Filter (exclude if in list)
            if(state.courseFilters.length > 0 && state.courseFilters.includes(r.course)) return;
            
            pts.push({...r, u:h.umaban, w:h.waku, course:r.course||''});
        }));
        
        const layout = { margin: {t:10,b:30,l:30,r:10}, xaxis:{zeroline:false}, yaxis:{zeroline:false}, showlegend:false };
        const cfg = {displayModeBar:false, responsive:true};
        
        // 芝=明るい緑, ダート=オレンジ (色覚に配慮した高彩度配色)
        const courseColor = (c) => c === '芝' ? '#00C853' : (c === 'ダート' || c === 'ダ') ? '#FF6D00' : '#888';
        const borderColors = pts.map(p => courseColor(p.course));
        
        // オッズ情報を取得するヘルパー
        const getOddsText = (u) => {
            const o = DATA.odds?.[state.race]?.[u];
            if(o && o.odds) return `${o.odds}倍 ${o.ninki}人気`;
            return '';
        };
        
        Plotly.newPlot('c1', [{
            x: pts.map(p=>p.l3f_idx), y: pts.map(p=>p.time_idx), mode:'markers+text', type:'scatter',
            marker: {size:12, color:pts.map(p=>WAKU[p.w]), line:{width:2,color:borderColors}},
            text: pts.map(p=>p.u), textposition:'middle center', textfont:{size:9, color:pts.map(p=>TXT[p.w])},
            hovertext: pts.map(p=>`${p.u}番 ${getOddsText(p.u)}<br>${p.date} ${p.course}`)
        }], {...layout, xaxis:{title:'上がり指数'}, yaxis:{title:'T指数'}}, cfg);
        
        Plotly.newPlot('c2', [{
            x: pts.map(p=>p.c1_ratio), y: pts.map(p=>p.time_idx), mode:'markers+text', type:'scatter',
            marker: {size:12, color:pts.map(p=>WAKU[p.w]), line:{width:2,color:borderColors}},
            text: pts.map(p=>p.u), textposition:'middle center', textfont:{size:9, color:pts.map(p=>TXT[p.w])},
            hovertext: pts.map(p=>`${p.u}番 ${getOddsText(p.u)}<br>${p.date} ${p.course}`)
        }], {...layout, xaxis:{title:'位置取り'}, yaxis:{title:'T指数'}}, cfg);

        Plotly.newPlot('c3', [{
            x: pts.map(p=>p.c1_ratio), y: pts.map(p=>p.l3f_idx), mode:'markers+text', type:'scatter',
            marker: {size:12, color:pts.map(p=>WAKU[p.w]), line:{width:2,color:borderColors}},
            text: pts.map(p=>p.u), textposition:'middle center', textfont:{size:9, color:pts.map(p=>TXT[p.w])},
            hovertext: pts.map(p=>`${p.u}番 ${getOddsText(p.u)}<br>${p.date} ${p.course}`)
        }], {...layout, xaxis:{title:'位置取り'}, yaxis:{title:'上がり指数'}, autorange:'reversed'}, cfg);

        Plotly.newPlot('c4', [{
            x: pts.map(p=>p.rpci), y: pts.map(p=>p.l3f_idx), mode:'markers+text', type:'scatter',
            marker: {size:12, color:pts.map(p=>WAKU[p.w]), line:{width:2,color:borderColors}},
            text: pts.map(p=>p.u), textposition:'middle center', textfont:{size:9, color:pts.map(p=>TXT[p.w])},
            hovertext: pts.map(p=>`${p.u}番 ${getOddsText(p.u)}<br>${p.date} ${p.course}`)
        }], {...layout, xaxis:{title:'RPCI'}, yaxis:{title:'上がり指数'}}, cfg);
    }

    // --- DATA ---
    function renderData() {
        const rows = DATA.races[state.race]?.rows || [];
        const headers = COLS.map(c => 
            `<div class="sort-chip ${state.sortCol===c?'active':''}" onclick="setState({sortCol:'${c}', sortAsc:${state.sortCol===c?!state.sortAsc:true} })">
                ${c} ${state.sortCol===c ? (state.sortAsc?'▲':'▼') : ''}
             </div>`
        ).join('');

        let content = '';
        if(state.sortCol) {
            const sorted = [...rows].sort((a,b) => {
                let va = a[state.sortCol]||'', vb = b[state.sortCol]||'';
                let na = parseFloat(va), nb = parseFloat(vb);
                if(!isNaN(na) && !isNaN(nb)) return state.sortAsc ? na-nb : nb-na;
                return state.sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
            });
            content = sorted.map(row => `
                <div class="card" style="padding:8px;">
                    <div class="flex-ac gap-2" style="border-bottom:1px solid #eee; margin-bottom:4px; padding-bottom:4px;">
                        <div class="h-num" style="background:${WAKU[getWaku(row['番'])] || '#ccc'}; color:${TXT[getWaku(row['番'])] || '#fff'}">${row['番']}</div>
                        <div class="text-xs font-bold" style="flex:1">${row['馬名']}</div>
                        <div class="text-xs text-light">${row['日付']}</div>
                        <div class="font-bold text-xs" style="color:${state.sortCol}">${row[state.sortCol]}</div>
                    </div>
                    <div class="grid-dense">
                        ${COLS.map(c => `<div class="gd-cell"><span class="gd-lbl">${c}</span><div class="gd-val">${row[c]||'-'}</div></div>`).join('')}
                    </div>
                </div>
            `).join('');
            content = `<div class="card" onclick="setState({sortCol:null})" style="text-align:center;padding:8px;color:var(--primary);font-weight:bold;cursor:pointer">↺ グループ表示に戻す</div>` + content;

        } else {
            const groups = {};
            rows.forEach(r => {
                const k = r['番']||'0';
                if(!groups[k]) groups[k] = [];
                groups[k].push(r);
            });
            content = Object.keys(groups).sort((a,b)=>parseInt(a)-parseInt(b)).map(k => {
                const list = groups[k];
                const meta = list[0];
                const w = getWaku(k);
                const open = state.expanded[state.race+'-'+k];
                const arrow = open ? '▲' : '▼';
                const body = open ? `
                    <div style="margin-top:8px">
                        ${list.map(row => `
                            <div style="margin-bottom:8px; border-bottom:1px dashed #eee; padding-bottom:4px;">
                                <div class="grid-dense">
                                    ${COLS.map(c => `<div class="gd-cell"><span class="gd-lbl">${c}</span><div class="gd-val">${row[c]||'-'}</div></div>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>` : '';
                return `
                <div class="card" style="padding:8px; cursor:pointer" onclick="togExpand('${k}')">
                    <div class="flex-ac">
                        <div class="h-num" style="background:${WAKU[w]}; color:${TXT[w]}">${k}</div>
                        <div class="flex-c" style="flex:1">
                            <div class="font-bold text-sm">${meta['馬名']}</div>
                            <div class="text-xs text-light">${meta['騎手']} (${list.length}走)</div>
                        </div>
                        <div class="text-light">${arrow}</div>
                    </div>
                    ${body}
                </div>`;
            }).join('');
        }
        return `<div class="card"><div class="font-bold text-xs mb-2">▼ 並び替え（タップでランキング表示）</div><div class="sort-area">${headers}</div></div>${content}`;
    }

    window.togExpand = (k) => {
        const key = state.race+'-'+k;
        setState({expanded: {...state.expanded, [key]:!state.expanded[key]} });
    };
    
    window.togMatchup = (k) => {
        const key = state.race+'-m-'+k;
        setState({expanded: {...state.expanded, [key]:!state.expanded[key]} });
    };

    // --- MATCHUP ---
    function renderMatchup() {
        const m = DATA.matchups[state.race];
        const mx = DATA.matrix[state.race];
        if(!m) return '<div class="card">データなし</div>';
        
        const sortedKeys = Object.keys(m).sort((a,b)=>parseInt(a)-parseInt(b));
        
        const headRow = sortedKeys.map(k => `<th>${k}</th>`).join('');
        const matrixBody = sortedKeys.map(h1 => {
            const cells = sortedKeys.map(h2 => {
                if(h1 === h2) return '<td style="background:#ddd">-</td>';
                const rec = (mx[h1] && mx[h1][h2]);
                if(!rec) return '<td></td>';
                // rec: w, l, d
                let cls = 'mx-draw'; 
                let txt = '';
                if(rec.w > 0) { cls='mx-win'; txt=`${rec.w}勝`; }
                else if(rec.l > 0) { cls='mx-lose'; txt=`${rec.l}敗`; }
                else { txt=`${rec.d}分`; }
                return `<td class="${cls}">${txt}</td>`;
            }).join('');
            return `<tr><th style="background:${WAKU[getWaku(h1)]};color:${TXT[getWaku(h1)]}">${h1}</th>${cells}</tr>`;
        }).join('');

        const matrixHTML = `
            <div class="card">
                <div class="font-bold text-xs mb-2">対戦早見表 (縦 vs 横)</div>
                <div class="matrix-box">
                    <table class="matrix-table">
                        <thead><tr><th></th>${headRow}</tr></thead>
                        <tbody>${matrixBody}</tbody>
                    </table>
                </div>
            </div>`;

        const listHTML = sortedKeys.map(k => {
            const list = m[k];
            const w = getWaku(k);
            const stats = {w:0, l:0, d:0};
            list.forEach(x => { if(x.result=='Win')stats.w++; else if(x.result=='Lose')stats.l++; else stats.d++; });
            
            const open = state.expanded[state.race+'-m-'+k];
            const arrow = open ? '▲' : '▼';
            
            const details = open ? list.map(x => {
                let cls = 'mx-draw';
                if(x.result==='Win') cls='mx-win';
                if(x.result==='Lose') cls='mx-lose';
                return `
                <div style="padding:8px; border-left:4px solid transparent; margin-bottom:6px; font-size:11px; background:#f9fafb; border-radius:4px" class="${cls}">
                    <div class="flex-sb" style="margin-bottom:4px;">
                        <div class="font-bold">vs ${x.opponent_name} (${x.opponent_num}番)</div>
                        <div style="font-weight:bold">${x.result}</div>
                    </div>
                    <div class="text-xs text-light" style="margin-bottom:4px;">
                        ${x.date} ${x.place} ${x.race_name} (${x.course} ${x.dist})
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                        <div>
                            <div class="text-xs text-light">自分 (${x.my_rank}着)</div>
                            <div class="grid-dense" style="grid-template-columns:1fr 1fr; margin-top:2px;">
                                <div class="gd-cell"><span class="gd-lbl">T指数</span><div class="gd-val">${x.my_idx}</div></div>
                                <div class="gd-cell"><span class="gd-lbl">通過</span><div class="gd-val">${x.my_pass}</div></div>
                                <div class="gd-cell"><span class="gd-lbl">上がり</span><div class="gd-val">${x.my_l3f}</div></div>
                                <div class="gd-cell"><span class="gd-lbl">RPCI</span><div class="gd-val">${x.my_rpci}</div></div>
                                <div class="gd-cell" style="grid-column:1/3"><span class="gd-lbl">タイム</span><div class="gd-val">${x.time}</div></div>
                            </div>
                        </div>
                        <div>
                            <div class="text-xs text-light">相手 (${x.op_rank}着)</div>
                            <div class="grid-dense" style="grid-template-columns:1fr 1fr; margin-top:2px;">
                                <div class="gd-cell"><span class="gd-lbl">T指数</span><div class="gd-val">${x.op_idx}</div></div>
                                <div class="gd-cell"><span class="gd-lbl">通過</span><div class="gd-val">${x.op_pass}</div></div>
                                <div class="gd-cell"><span class="gd-lbl">上がり</span><div class="gd-val">${x.op_l3f}</div></div>
                                <div class="gd-cell"><span class="gd-lbl">RPCI</span><div class="gd-val">${x.op_rpci}</div></div>
                                <div class="gd-cell" style="grid-column:1/3"><span class="gd-lbl">タイム</span><div class="gd-val">${x.op_time}</div></div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('') : '';

            // border-bottom style adjust
            const bb = open ? '1px solid #eee' : 'none';

            return `
            <div class="card" style="padding:0">
                <div class="flex-ac" style="padding:8px; border-bottom:${bb}; cursor:pointer" onclick="togMatchup('${k}')">
                    <div class="h-num" style="background:${WAKU[w]}; color:${TXT[w]}">${k}</div>
                    <div class="font-bold text-sm">対戦成績: ${stats.w}勝 ${stats.l}敗 ${stats.d}分</div>
                    <div class="text-light" style="margin-left:auto">${arrow}</div>
                </div>
                ${open ? `<div style="padding:8px">${details}</div>` : ''}
            </div>`;
        }).join('');

        return matrixHTML + listHTML;
    }

    function renderNav() {
        const tabs = [{id:'summary',l:'サマリー',i:'📌'},{id:'chart',l:'チャート',i:'📊'},{id:'data',l:'データ',i:'📋'},{id:'matchup',l:'比較',i:'⚔️'}];
        return `<div class="nav">${tabs.map(t=>
            `<div class="nav-btn ${state.tab==t.id?'active':''}" onclick="setState({tab:'${t.id}'})">
                <div class="nav-icon">${t.i}</div>${t.l}
             </div>`).join('')}</div>`;
    }
    
    init();
</script>
</body>
</html>
