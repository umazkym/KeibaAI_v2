# JRA公式クラス制度へのマッピング設定
# Version: 2024-12
# 
# このファイルはrace_classの正規化ルールを定義します。
# JRAがクラス制度を変更した場合は、このファイルを更新してください。

# 正規化後のクラス一覧（序数: クラスの強さスコア 1-10）
# 大きい数字ほど上位クラス
normalized_classes:
  G1: 10
  G2: 9
  G3: 8
  リステッド: 7
  オープン: 6
  3勝クラス: 5
  2勝クラス: 4
  1勝クラス: 3
  未勝利: 2
  新馬: 1

# 旧race_class値→正規化クラス名のマッピング
# パーサーが出力した値をここでマッピング
legacy_mapping:
  "500": "1勝クラス"      # 旧500万下 = 新1勝クラス
  "1000": "2勝クラス"     # 旧1000万下 = 新2勝クラス  
  "1600": "3勝クラス"     # 旧1600万下 = 新3勝クラス
  "OP": "オープン"

# race_nameからクラスを抽出するパターン（優先順に評価）
# race_classがNoneまたは不明の場合に使用
extraction_patterns:
  # 重賞（最優先 - 長いパターンから評価）
  # 注意: GIがGIIIにもマッチしないよう、GIIIを最初に評価
  - patterns: ["(G3)", "（G3）", "(GIII)", "GⅢ", "(JG3)", "(JGIII)"]
    class: "G3"
  
  - patterns: ["(G2)", "（G2）", "(GII)", "GⅡ", "(JG2)", "(JGII)"]
    class: "G2"
  
  - patterns: ["(G1)", "（G1）", "(GI)", "GⅠ", "(JG1)", "(JGI)"]
    class: "G1"

  
  # リステッド
  - patterns: ["(L)", "（L）"]
    class: "リステッド"
  
  # 条件クラス（新制度: 2019年秋以降）
  - patterns: ["3勝クラス", "3勝"]
    class: "3勝クラス"
  
  - patterns: ["2勝クラス", "2勝"]
    class: "2勝クラス"
  
  - patterns: ["1勝クラス", "1勝"]
    class: "1勝クラス"
  
  # 条件クラス（旧制度: 〜2019年夏）
  - patterns: ["1600万"]
    class: "3勝クラス"
  
  - patterns: ["1000万"]
    class: "2勝クラス"
  
  - patterns: ["500万"]
    class: "1勝クラス"
  
  # 新馬・未勝利
  - patterns: ["新馬"]
    class: "新馬"
  
  - patterns: ["未勝利"]
    class: "未勝利"
  
  # オープン（最後に評価）
  - patterns: ["オープン", "(OP)", "（OP）"]
    class: "オープン"
  
  # 旧「重賞」表記（リステッド導入前の特別競走）
  - patterns: ["(重賞)", "（重賞）"]
    class: "リステッド"

